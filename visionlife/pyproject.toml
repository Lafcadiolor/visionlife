[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionlife"
version = "0.1.0"
description = "A personal media ingestion and dashboard pipeline for images, screenshots, videos, and documents."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Loren Earle-Cruickshanks" }
]
dependencies = [
  "watchdog>=4.0.0,<5.0.0",
  "Pillow>=10.4.0,<11.0.0",
  "openai>=2.0.0,<3.0.0",
  "coremltools>=8.3.0,<9.0.0",
]

[tool.setuptools]
py-modules = [
  "batch_ingest",
  "batch_setup",
  "dashboard_sync",
  "db",
  "fast_sort",
  "main",
  "migrate_sensitive_outputs",
  "records",
  "results_app",
  "run_rich_batch",
  "sensitive",
  "utils",
  "vision",
  "visual_resource_search",
  "watcher",
]

[tool.setuptools.packages.find]
include = ["pipeline", "services"]
