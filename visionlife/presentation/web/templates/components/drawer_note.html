<article class="drawer-note {{state_label}}">
  <div class="drawer-note-head">
    <a href="/note?file={{filename}}">{{title}}</a>
    <span class="drawer-note-category">{{category}}</span>
  </div>
  {{preview_html}}
  <div class="drawer-note-summary">{{summary}}</div>
  <div class="drawer-note-actions">{{actions_html}}{{calendar_html}}</div>
</article>
